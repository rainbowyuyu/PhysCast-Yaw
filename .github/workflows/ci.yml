name: checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
      - name: Install package and test tools
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: python -m ruff check src tests examples
      - name: Tests
        run: python -m pytest -q
      - name: Verify committed benchmark evidence
        run: python examples/verify_benchmark.py
      - name: Package
        run: python -m build
      - name: End-to-end smoke run
        if: runner.os == 'Linux'
        run: physcast-yaw demo --quick --out outputs/ci-smoke
