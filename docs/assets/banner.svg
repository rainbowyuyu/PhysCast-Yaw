  <use href="#turbine" transform="translate(1045 260) scale(.9)"/>
  <use href="#turbine" transform="translate(1245 198) scale(.76)"/>
  <g fill="#d98a30"><circle cx="845" cy="195" r="7"/><circle cx="1045" cy="260" r="6"/><circle cx="1245" cy="198" r="5"/></g>
</svg>
